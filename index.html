<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Guru | Sistem Absensi Digital Siswa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6fb;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 32px;
    }

    .login-container h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1f2937;
    }

    .login-container p {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-login:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
    }

    .message.error {
      color: #dc2626;
    }

    .message.success {
      color: #16a34a;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      background: #f9fafb;
      padding: 12px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Login Guru</h1>
    <p>Masuk ke sistem absensi digital siswa menggunakan akun guru.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password" required />
      </div>

      <button type="submit" class="btn-login">Login</button>
      <div id="message" class="message"></div>
    </form>

    <div class="note">
      Contoh akun sementara:<br />
      Username: <strong>guru1</strong><br />
      Password: <strong>123456</strong>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
